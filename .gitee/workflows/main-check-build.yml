version: "1.0"
name: main-check-build
displayName: Main Check Build
triggers:
  push:
    branches:
      precise:
        - main
variables:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 11.20.0
stages:
  - name: verify_build
    displayName: 校验与构建
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@nodejs
        name: check_build
        displayName: 安装 Node 24 后执行 check/build
        nodeVersion: 14.16.0
        commands:
          - bash ./scripts/ci/run-check-build.sh
        artifacts:
          - name: DIST_ARTIFACT
            path:
              - ./dist
